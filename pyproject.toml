[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-infinicore"
version = "0.1.0"
description = "InfiniCore operator routes for vendor vLLM platforms"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
vllm_infinicore = "vllm_infinicore:register"

[tool.hatch.build.targets.wheel]
packages = ["vllm_infinicore"]
include = [
    "vllm_infinicore/operators/csrc/*.cpp",
    "vllm_infinicore/operators/ascend/csrc/*",
    "vllm_infinicore/infinicore.lock.json",
]
